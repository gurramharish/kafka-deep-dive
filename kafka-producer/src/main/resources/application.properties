server.port=8080
spring.application.name=kafka-producer

spring.kafka.bootstrap-servers=localhost:9095,localhost:9096

enable.scheduled.producer=false

topic.name=order-events-topic

spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

## If the producer uses JsonSerializer and add type headers is true by default until you add the property to make it false
# A _TypeId_ header is added for every record if the KafkaTemplate<String, Order> of specific type instead of Object class
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

#--------------- RECORD ACCUMULATOR ---------------
# Batching wait 20ms to collect more messages before sending or 32KB Batch size
spring.kafka.producer.batch-size=32768
spring.kafka.producer.linger-ms=20

#--------------- COMPRESSION ---------------
# Enable compression
spring.kafka.producer.compression-type=snappy

#--------------- RETRIES ---------------
# Enable retries
spring.kafka.producer.retries=3

# Max in flight requests
spring.kafka.producer.max-in-flight-requests-per-connection=5

# Idempotency
# Prevents Duplicate messages on retry AND preserves ordering with in-flight > 1
# When true, each message gets PID(producer ID) + sequence number
# Broker rejects out-of-order sequences -> forces correct ordering even with retries
# Also forces: acks = all, retries=MAX_INT internally
spring.kafka.producer.properties.enable.idempotence=true

#--------------- TRANSACTION PROPERTIES ---------------
# Enable transactions
spring.kafka.producer.transaction-id-prefix=deep-dive-transaction-id-
spring.kafka.producer.properties.transaction.timeout.ms=60000

