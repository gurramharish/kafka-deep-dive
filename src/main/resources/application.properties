server.port=8080
spring.application.name=kafka-deep-dive

spring.kafka.bootstrap-servers=localhost:9095,localhost:9096

enable.scheduled.producer=false
enable.record.consumer=true

topic.name=order-events-topic

spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

## If the producer uses JsonSerializer and add type headers is true by default until you add the property to make it false
# A _TypeId_ header is added for every record if the KafkaTemplate<String, Order> of specific type instead of Object class
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

#--------------- RECORD ACCUMULATOR ---------------
# Batching wait 20ms to collect more messages before sending or 32KB Batch size
spring.kafka.producer.batch-size=32768
spring.kafka.producer.linger-ms=20

#--------------- COMPRESSION ---------------
# Enable compression
spring.kafka.producer.compression-type=snappy

#--------------- RETRIES ---------------
# Enable retries
spring.kafka.producer.retries=3

# Max in flight requests
spring.kafka.producer.max-in-flight-requests-per-connection=5

## problem with retry and max-in-flight-requests-per-connection
# 1. Broker might write duplicate records in to partition
# 2. Message reordering may happen
# To solve the above problem we need to set idempotency = true

# Idempotency
# Prevents Duplicate messages on retry AND preserves ordering with in-flight > 1
# When true, each message gets PID(producer ID) + sequence number
# Broker rejects out-of-order sequences -> forces correct ordering even with retries
# Also forces: acks = all, retries=MAX_INT internally
# Even with idempotence true there is a loophole where there is a chance of duplicate messages
# as the producer or re-start may try sending them again which might be in In_progress
# we can solve this problem with transactions
spring.kafka.producer.properties.enable.idempotence=true


## -------- CONSUMER PROPERTIES --------

## Consumer metadata refresh
# By default it is 5 minutes
spring.kafka.consumer.properties.metadata.max.age.ms=5

## Poll timeout
spring.kafka.listener.poll-timeout=5000


## How many messages we can poll from the topic(1MB)
spring.kafka.consumer.properties.max.partition.fetch.bytes=1048576

## Max data(total) the broker can return in one request(52MB)
spring.kafka.consumer.properties.fetch.max.bytes=52428800

## Broker decides when to response
## Minimum data (in bytes) the broker must have before responding
spring.kafka.consumer.properties.fetch.min.bytes=1

## How long broker can hold the request to meet fetch.min.bytes(0.5 sec)
spring.kafka.consumer.properties.fetch.max.wait.ms=500

## Max number of records returned in a single poll() call
## Broker might send more records like 2000 to match the fetch.max.bytes
## But if we configure max poll records as 100 it will keep the remaining 1900 in the
## buffer and next time it will poll 100 from those 1900 instead of going to broker
spring.kafka.consumer.properties.max.poll.records=100

## Can we have gap between polls
spring.kafka.listener.idle-between-polls=5

## how to know if consumer is stuck while processing the events
## or any other issue with consumer
# By setting below property consumer sends Heartbeat Pulse to Group Coordinator every 3 seconds
spring.kafka.consumer.properties.heartbeat.interval.ms=3000

## Max time group coordinator will wait for the heartbeat (generally its higher than heartbeat.interval.ms)
# after this say 45seconds it will Consumer as dead and initiate rebalance
spring.kafka.consumer.properties.session.timeout.ms=45000


## Group Coordinator expeacts 1 poll() call every 5mins
## If the consumer is not able to process the records with in 5 mins
# group coordinator will think that consumer got stuck and initiates rebalance
spring.kafka.consumer.properties.max.poll.interval.ms=300000


## For auto commit
## Auto commit offset
# consumer commits offset to the broker automatically
# after every poll() call
# Auto commit happens in background thread
# By default auto.commit.interval.ms is 5secs
# But if we set auto.commit.interval.ms to 1 sec and 
spring.kafka.consumer.properties.auto.commit.interval.ms=1000
spring.kafka.consumer.properties.enable.auto.commit=true



## Manual commit offset
#consumer commits offset to the broker manually after processing the records
# By default manual commit is disabled
# To enable manual commit we need to set enable.auto.commit to false
spring.kafka.consumer.properties.enable.auto.commit=false
## deafult ack mode is batch
## Drawbacks with batch mode is if lets say last message is failed, whole batch needs to retried as the offset is committed
spring.kafka.listener.ack-mode=manual













spring.kafka.consumer.group-id=order-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.hans.event.consumer.NotifyEvent


## When we are not going to use __TypeId__ header, then we can disable it by setting the below property to false
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.remove.type.headers=false
spring.kafka.consumer.properties.spring.json.type.mapping=com.hans.event.Order:com.hans.event.Order,com.hans.event.producer.PaymentEvent:com.hans.event.consumer.PaymentEvent,com.hans.event.producer.NotifyEvent:com.hans.event.consumer.NotifyEvent

## Flow at consumer side if _TypeId_ header is present
# 1. For each event we get bytes + headers when we consume using ConsumerRecord
# 2. It checks if the value deserializer is JacksonJsonDeserializer
# 3. If No, it uses custom deserializer
# 4. If yes deserializer is JacksonJsonDeserializer and there is 1 more config in property
# 5. spring.kafka.consumer.properties.spring.json.use.type.headers=true(by default true)
# 6. If no, it will use the default type specified in the property spring.kafka.consumer.properties.spring.json.value.default.type=com.hans.event.Order
# 7. If yes, then it checks if the _TypeId_ header is present
# 8. If no, then it uses the default type specified in the property pring.kafka.consumer.properties.spring.json.value.default.type=com.hans.event.Order
# 9. If yes, then it checks if there is mapping present spring.kafka.consumer.properties.spring.json.value.type.mapping=(from)com.hans.event.Order:(to)com.hans.event.Order
# 10. If yes, then it uses to class and converts to the type specified in the mapping
# 11. If no, mapping not present then it check the _TypeId_ has a TrustedPackage then load the class if exists and deserialize
# 12. If no, TrustedPackage not present then it throws the IllegalArgumentException
# 13. If trusted no class then it throws the ClassNotFoundException


